services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cacss
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cacss?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-please-change-this-docker-secret}
      AUTH_TRUST_HOST: "true"
    depends_on:
      - db

volumes:
  pgdata:
